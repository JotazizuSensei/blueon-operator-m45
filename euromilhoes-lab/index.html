<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071827">
  <meta name="description" content="Registo, resultados e análise pessoal do Euromilhões.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Euromilhões Lab</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06121d;color:#eef6fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.box{width:min(520px,calc(100% - 32px));padding:28px;border:1px solid #24465c;border-radius:20px;background:#0b2132;text-align:center;box-shadow:0 18px 45px rgba(0,0,0,.3)}.logo{width:62px;height:62px;margin:0 auto 16px;display:grid;place-items:center;border-radius:18px;background:#1f4f8a;color:#f4c95d;font-size:25px;font-weight:900}.spin{width:34px;height:34px;margin:22px auto;border:4px solid #24465c;border-top-color:#36a6e8;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}p{color:#9bb0bf;line-height:1.55}.error{color:#ffb2b2}.retry{display:none;margin:18px auto 0;border:0;border-radius:12px;padding:12px 18px;background:#36a6e8;color:#04111b;font-weight:800}
  </style>
</head>
<body>
  <main class="box">
    <div class="logo">€L</div>
    <h1>Euromilhões Lab</h1>
    <div class="spin" id="spin"></div>
    <p id="status">A carregar a versão atualizada…</p>
    <button class="retry" id="retry" onclick="location.reload()">Tentar novamente</button>
  </main>
<script>
(async()=>{
  const status=document.getElementById('status');
  const retry=document.getElementById('retry');
  const cacheKey='euromilhoesLabV3Shell301';
  const files=['chunk_00','chunk_01','chunk_02','chunk_03'];
  function parseTar(buffer){
    const bytes=new Uint8Array(buffer), decoder=new TextDecoder();
    let offset=0, result={};
    while(offset+512<=bytes.length){
      const header=bytes.slice(offset,offset+512);
      const name=decoder.decode(header.slice(0,100)).replace(/\0.*$/,'');
      if(!name) break;
      const sizeText=decoder.decode(header.slice(124,136)).replace(/\0.*$/,'').trim();
      const size=parseInt(sizeText||'0',8);
      const start=offset+512;
      result[name.replace(/^\.\//,'')]=bytes.slice(start,start+size);
      offset=start+Math.ceil(size/512)*512;
    }
    return result;
  }
  async function onlineHtml(){
    const texts=await Promise.all(files.map(name=>fetch('../euromilhoes-v3-payload/'+name+'?v=3.0.1',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})));
    const binary=atob(texts.join('').replace(/\s/g,''));
    const compressed=Uint8Array.from(binary,c=>c.charCodeAt(0));
    if(!('DecompressionStream' in window)) throw new Error('Navegador sem suporte de descompressão');
    const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
    const archive=parseTar(await new Response(stream).arrayBuffer());
    if(!archive['index.html']) throw new Error('Aplicação não encontrada no pacote');
    return new TextDecoder().decode(archive['index.html']);
  }
  function correctKnownResult(html){
    return html.replace('numbers:[20,30,34,46,50],stars:[1,12]','numbers:[25,30,34,46,50],stars:[1,12]');
  }
  function launch(html){
    html=correctKnownResult(html);
    localStorage.setItem(cacheKey,html);
    document.open();document.write(html);document.close();
  }
  try{
    launch(await onlineHtml());
  }catch(error){
    const cached=localStorage.getItem(cacheKey);
    if(cached){status.textContent='Sem ligação. A abrir a última versão guardada…';setTimeout(()=>launch(cached),150);return;}
    document.getElementById('spin').style.display='none';
    status.className='error';status.textContent='Não foi possível carregar a aplicação. Confirma a ligação à Internet e tenta novamente.';
    retry.style.display='block';console.error(error);
  }
})();
</script>
</body>
</html>
