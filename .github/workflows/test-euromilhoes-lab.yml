name: Testar Euro Lab

on:
  push:
    branches: [main]
    paths:
      - 'euromilhoes-lab/**'
      - '.github/workflows/test-euromilhoes-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sintaxe JavaScript
        run: |
          node --check euromilhoes-lab/app-v5.js
          node --check euromilhoes-lab/sw.js

      - name: Sintaxe Python
        run: python -m py_compile euromilhoes-lab/update_results.py

      - name: Validar PWA e dados
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('euromilhoes-lab')
          manifest=json.loads((p/'manifest.webmanifest').read_text())
          results=json.loads((p/'latest-results.json').read_text())
          assert manifest['display']=='standalone'
          assert manifest['start_url']=='./'
          assert len(manifest['icons'])>=2
          assert results['em']['date'] >= '2026-08-07'
          assert results['ed']['date'] >= '2026-08-10'
          assert results['m1']['date'] == '2026-07-31'
          html=(p/'index.html').read_text()
          assert 'Euro Lab' in html
          assert 'EuroDreams' in html
          assert 'M1lhão' in html
          for asset in ['v5.css','app-v5.js','sw.js','manifest.webmanifest','icon-192.png','icon-512.png','latest-results.json']:
              assert (p/asset).is_file() and (p/asset).stat().st_size>0, asset
          print('EURO_LAB_STATIC_TESTS_OK')
          PY

      - name: Smoke test HTTP
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory euromilhoes-lab >/tmp/eurolab-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          curl --fail --silent http://127.0.0.1:8765/ | grep -q 'Euro Lab'
          curl --fail --silent http://127.0.0.1:8765/app-v5.js | grep -q 'EuroDreams'
          curl --fail --silent http://127.0.0.1:8765/manifest.webmanifest | python -m json.tool >/dev/null
          curl --fail --silent http://127.0.0.1:8765/latest-results.json | python -m json.tool >/dev/null
          echo HTTP_SMOKE_TESTS_OK
