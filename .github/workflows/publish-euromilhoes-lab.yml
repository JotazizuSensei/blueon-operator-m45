name: Publicar Euromilhoes Lab

on:
  push:
    branches: [main]
    paths:
      - 'euromilhoes-payload/**'
      - '.github/workflows/publish-euromilhoes-lab.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositorio
        uses: actions/checkout@v4

      - name: Reconstruir PWA
        run: |
          rm -rf euromilhoes-lab
          mkdir -p euromilhoes-lab
          cat euromilhoes-payload/chunk_* | base64 --decode > /tmp/euromilhoes-lab.tar.gz
          tar -xzf /tmp/euromilhoes-lab.tar.gz -C euromilhoes-lab
          test -s euromilhoes-lab/index.html
          test -s euromilhoes-lab/manifest.webmanifest
          test -s euromilhoes-lab/sw.js
          touch .nojekyll

      - name: Guardar PWA no repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add euromilhoes-lab .nojekyll
          git commit -m 'Publicar Euromilhoes Lab PWA' || true
          git push
