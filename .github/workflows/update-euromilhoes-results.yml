name: Atualizar resultados Euromilhoes Lab

on:
  push:
    branches: [main]
    paths:
      - 'euromilhoes-lab/update_results.py'
      - '.github/workflows/update-euromilhoes-results.yml'
  schedule:
    - cron: '*/15 19-23 * * 2,5'
    - cron: '15 7 * * 3,6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-euromilhoes
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Procurar ultimo resultado oficial
        run: python euromilhoes-lab/update_results.py

      - name: Publicar atualizacao
        run: |
          if git diff --quiet -- euromilhoes-lab/latest-result.json; then
            echo 'Sem alteracoes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add euromilhoes-lab/latest-result.json
          git commit -m 'Atualizar resultado do Euromilhoes'
          git push
