name: Deploy BLUE ON Operator M45

on:
  push:
    branches: [main]
    paths-ignore:
      - 'pages-status.json'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar site publicado
        run: |
          rm -rf _site
          mkdir -p _site
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name '_site' \
            ! -name 'euromilhoes-payload' \
            -exec cp -a {} _site/ \;
          test -s _site/index.html
          test -s _site/euromilhoes-lab/index.html
          test -s _site/euromilhoes-lab/manifest.webmanifest
          test -s _site/euromilhoes-lab/sw.js
          test -s _site/euromilhoes-lab/latest-result.json
          test -s _site/euromilhoes-v3-payload/chunk_00
          test -s _site/euromilhoes-v3-payload/chunk_03

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Registar publicação concluída
        run: |
          printf '{"status":"published","commit":"%s","page_url":"%s","euromilhoes_url":"%s/euromilhoes-lab/"}\n' \
            "$GITHUB_SHA" \
            "${{ steps.deployment.outputs.page_url }}" \
            "${{ steps.deployment.outputs.page_url }}" > pages-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages-status.json
          git commit -m 'Registar publicação GitHub Pages [skip ci]' || true
          git push
